name: Build VICECITYWIRE Android test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "*.jpg"
      - "*.webmanifest"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-test-build.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install image renderer
        run: python -m pip install --user pillow

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build bundled web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Apply official VICECITYWIRE launcher icon
        shell: bash
        run: |
          set -euo pipefail
          test -s icon.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("icon.png").convert("RGB")
          for density, size in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              target = Path(f"android/app/src/main/res/mipmap-{density}")
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png", format="PNG", optimize=True)
              icon.save(target / "ic_launcher_round.png", format="PNG", optimize=True)

          # Capacitor ships a default foreground drawable. Replace the exact
          # resource path referenced by the adaptive icon, not drawable-nodpi-v4.
          foreground = Path("android/app/src/main/res/drawable/ic_launcher_foreground.png")
          foreground.parent.mkdir(parents=True, exist_ok=True)
          source.resize((432, 432), Image.Resampling.LANCZOS).save(foreground, format="PNG", optimize=True)
          PY
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          rm -f android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          adaptive="android/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p "$adaptive"
          cat > "$adaptive/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$adaptive/ic_launcher.xml" "$adaptive/ic_launcher_round.xml"
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources>
              <color name="ic_launcher_background">#090d15</color>
          </resources>
          EOF
          test ! -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.png

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: vicecitywire-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
